schema: spec-driven

context: |
  Tech stack: Next.js 16 (App Router), React 19, TypeScript, Tailwind CSS v4, Prisma (PostgreSQL), Zustand, react-hook-form, zod.
  Architecture: App Router with modular components, Route Handlers (no Server Actions), Zustand global state, react-hook-form + zod.
  Testing: No test runner configured (Strict TDD Mode: disabled).
  Style: ESLint, tsc --noEmit.

strict_tdd: false

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
  verify:
    - Run linting and type checking (eslint, tsc --noEmit)
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)

testing:
  strict_tdd: false
  capabilities:
    test_runner:
      command: ""
      framework: "none"
    layers:
      unit: false
      integration: false
      e2e: false
    coverage:
      available: false
      command: ""
    quality_tools:
      linter:
        available: true
        command: "npm run lint"
      type_checker:
        available: true
        command: "npx tsc --noEmit"
      formatter:
        available: false
        command: ""
